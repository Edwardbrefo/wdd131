<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review form to collect customer feedback on electronics including rating, installation date, and detailed reviews.">
    <meta name="author" content="Edward Brefo">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/forms.css">
    <script src="scripts/forms.js" defer></script>
</head>
<body>
    <header><h1>
        Product Review
    </h1></header>
    <main>
      <form id="reviewForm">
        <fieldset>
        <legend>Product Name <span class="required">*</span></legend>
        <select name="product" id="productSelect" required>
            <option value="" disabled selected>--Please choose an option--</option>
        </select>
        </fieldset>

        <fieldset>
        <legend>Overall Rating <span class="required">*</span></legend>
        <input type="radio" id="1star" name="rating" value="1" required>
        <label for="1star">⭐</label>
        <input type="radio" id="2star" name="rating" value="2">
        <label for="2star">⭐⭐</label>
        <input type="radio" id="3star" name="rating" value="3">
        <label for="3star">⭐⭐⭐</label>
        <input type="radio" id="4star" name="rating" value="4">
        <label for="4star">⭐⭐⭐⭐</label>
        <input type="radio" id="5star" name="rating" value="5">
        <label for="5star">⭐⭐⭐⭐⭐</label>
        </fieldset>

        <fieldset>
        <legend>Date Of Installation <span class="required">*</span></legend>
        <input type="date" id="dateInstall" name="dateInstall" required>
        </fieldset>
        
        <fieldset>
        <legend>Useful Features</legend>

        <input type="checkbox" id="featureEfficiency" name="features" value="Energy Efficiency">
        <label for="featureEfficiency">Energy Efficiency</label><br>

         <input type="checkbox" id="featureDurability" name="features" value="Durability">
         <label for="featureDurability">Durability</label><br>

         <input type="checkbox" id="featureDesign" name="features" value="Design">
         <label for="featureDesign">Design</label><br>

        <input type="checkbox" id="featureEase" name="features" value="Ease of Use">
        <label for="featureEase">Ease of Use</label><br>

        <input type="checkbox" id="featureSupport" name="features" value="Customer Support">
         <label for="featureSupport">Customer Support</label>
        </fieldset>
    
        <fieldset>
        <legend>Written Review <span class="required">*</span></legend>
        <textarea id="reviewText" name="reviewText" rows="4" cols="50" required></textarea>
        </fieldset>
        
        <fieldset>
        <legend>Full Name</legend>
        <input type="text" id="fullName" name="fullName">
        </fieldset>

        <button type="submit">Post Review</button>

      </form>
      <p id="reviewCount" style="text-align: center; margin-top: 1rem; font-weight: bold;"></p>
    </main>
    <footer>
    <p>©️ <span id="currentyear"></span> Edward Brefo | Greater Accra,Ghana</p>
    <p id="lastModified"></p>
    </footer>
</body>
</html>
